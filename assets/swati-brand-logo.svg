<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="50%" stop-color="#F3E7C4"/>
      <stop offset="100%" stop-color="#C59B47"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C59B47" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Luxury Emblem Badge (Shield / Rounded Square Container) -->
  <g transform="translate(10, 10)">
    <!-- Base Container -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#roseGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#subtleGlow)"/>
    
    <!-- Inner Accent Ring -->
    <rect x="5" y="5" width="90" height="90" rx="19" fill="none" stroke="#F3E7C4" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="3,2"/>

    <!-- Stylized Woman Profile Forming Graceful 'S' Letterform -->
    <g transform="translate(18, 14) scale(0.64)">
      <!-- Flowing Hair S-Curve (Upper Loop of 'S') -->
      <path d="M50 8 C72 8 88 22 88 40 C88 54 78 64 62 70 C44 76 32 84 32 96 C32 108 44 116 60 116 C76 116 88 106 90 94" 
            fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
      
      <!-- Elegant Female Facial Profile -->
      <path d="M48 38 C54 44 58 50 56 58 C55 63 50 67 46 72 C44 74 46 77 50 78 C54 79 56 83 52 87 C48 91 42 93 38 98" 
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Delicate Eyelash / Eye closed in serenity -->
      <path d="M51 52 C54 53 56 55 58 58" fill="none" stroke="#F3E7C4" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M56 54 L60 52" fill="none" stroke="#F3E7C4" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Lower Hair Curl & Neck Line (Completing Lower 'S') -->
      <path d="M38 98 C34 104 36 112 42 118 C52 126 70 124 82 112 C88 106 94 92 92 78" 
            fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      
      <!-- Sparkle / Star Accent on Hair Crown -->
      <path d="M68 20 L70 14 L72 20 L78 22 L72 24 L70 30 L68 24 L62 22 Z" fill="#FFF8E7"/>
    </g>
  </g>

  <!-- High-End Editorial Brand Typography -->
  <g transform="translate(130, 26)">
    <!-- Primary Brand Wordmark 'SWATI' -->
    <text x="0" y="44" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="46" font-weight="900" fill="#1C1917" letter-spacing="3">
      SWATI
    </text>

    <!-- Subtitle: Hair & Beauty Family Salon -->
    <text x="2" y="68" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#9F1239" letter-spacing="4">
      HAIR &amp; BEAUTY FAMILY SALON
    </text>

    <!-- Heritage & Location Tag -->
    <text x="2" y="85" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#A8A29E" letter-spacing="2">
      BOLLYWOOD EXPERIENCE 30TH YEAR • KOLAR ROAD, BHOPAL
    </text>
  </g>
</svg>
