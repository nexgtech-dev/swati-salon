name: NexG Tech CI/CD Staging Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # STAGE 1: CONTINUOUS INTEGRATION (Lint, Integrity & Security Gate)
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Build
        uses: actions/checkout@v4

      - name: Verify HTML5 Integrity & Asset Links
        run: |
          echo "🔍 Running NexG Pre-Deployment Quality Gate..."
          
          # Check index.html existence
          if [ ! -f "index.html" ]; then
            echo "❌ Fatal: index.html is missing!"
            exit 1
          fi
          
          # Check essential meta tags
          grep -q "<meta charset=" index.html || (echo "❌ Missing charset meta tag" && exit 1)
          grep -q "<meta name=\"viewport\"" index.html || (echo "❌ Missing viewport meta tag" && exit 1)
          grep -q "<title>" index.html || (echo "❌ Missing title tag" && exit 1)
          
          # Check that local assets referenced in HTML actually exist
          echo "Verifying local assets..."
          grep -o 'assets/[^"'\'' ]*' index.html | while read -r asset; do
            if [ ! -f "$asset" ]; then
              echo "⚠️ Warning: Referenced asset not found locally: $asset"
            else
              echo "✅ Asset verified: $asset"
            fi
          done
          
          echo "✅ All CI Quality Gates passed successfully."

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  # STAGE 2: CONTINUOUS DEPLOYMENT (Edge CDN Release)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-package
    steps:
      - name: Deploy to GitHub Pages Edge
        id: deployment
        uses: actions/deploy-pages@v4
